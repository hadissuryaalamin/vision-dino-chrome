<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vision Dino: game playground (dev only)</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #e9e9e9;
        color: #222;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 900 / 560;
        border: 1px solid #aaa;
        background: #f7f7f7;
      }
      kbd {
        padding: 0 4px;
        border: 1px solid #999;
        border-radius: 3px;
        background: #fff;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Game playground (dev only)</h1>
      <p>
        <kbd>W</kbd> Player 1 jumps · <kbd>↑</kbd> Player 2 jumps · <kbd>Enter</kbd> start or
        restart · <kbd>P</kbd> pause or resume. URL options: <code>?seed=123</code>,
        <code>?roundEnd=first-crash</code>.
      </p>
      <canvas id="game" role="img" aria-label="Two-lane dinosaur runner"></canvas>
      <p id="status" aria-live="polite"></p>
      <ol id="log" reversed></ol>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
