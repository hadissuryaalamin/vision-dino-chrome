# Deploys the static build to GitHub Pages on every push to main (decision O-02).
# `npm run check` runs first, so a failing check never deploys.
# One-time setup by the repository owner: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, lint, format check, tests and build
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # upload-pages-artifact v5 and deploy-pages v5 are the matched pair: v5 uploads with
      # actions/upload-artifact v7, whose artifacts older deploy-pages versions cannot read.
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
